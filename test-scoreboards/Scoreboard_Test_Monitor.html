  <style>
    body {
      background-color: #060a12;

      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .board-cell {
      font-variant-numeric: tabular-nums;
    }
    .strike-miss {
      text-decoration: line-through;
      text-decoration-thickness: 2.5px;
    }
  </style>

<body class="antialiased select-none">

  <!-- Top Controls Bar -->
  <div id="controlsPanel" class="bg-slate-900 border border-slate-700 rounded-xl p-4 mb-5 shadow-lg max-w-7xl mx-auto">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
      <div>
        <h1 class="text-lg font-bold text-white">📺 Competition Scoreboard Test Monitor (6 Scenarios)</h1>
        <p class="text-xs text-slate-400">Select a scenario below, press F11 for full screen if desired, and scan the monitor with your phone camera in Comp OWL.</p>
      </div>
      <div class="flex items-center gap-2">
        <button id="toggleGuideBtn" onclick="toggleGuide()" class="px-3 py-1.5 rounded-lg text-xs font-semibold border border-slate-600 bg-slate-800 text-slate-200 hover:bg-slate-700">
          📋 Hide Expected Results
        </button>
        <button onclick="enterCleanTvMode(true)" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-sky-600 text-white hover:bg-sky-500">
          📷 Clean TV Mode (Hide UI for Photo)
        </button>
      </div>
    </div>

    <!-- Scenario Buttons -->
    <div class="grid grid-cols-2 md:grid-cols-3 gap-2" id="scenarioButtons"></div>

    <!-- Expected Results Cheat Sheet for Active Scenario -->
    <div id="expectedGuide" class="mt-3 p-3 rounded-lg border border-slate-700 bg-slate-950 text-xs text-slate-300 space-y-1.5"></div>
  </div>

  <!-- Floating Restore Button when in Clean TV Mode -->
  <div id="restoreControlsBar" class="hidden mb-2 max-w-7xl mx-auto flex justify-end">
    <button onclick="enterCleanTvMode(false)" class="px-3 py-1 rounded bg-slate-800 text-slate-300 text-xs border border-slate-600 hover:bg-slate-700">
      ⚙️ Show Scenario Controls
    </button>
  </div>

  <!-- SCOREBOARD TV MONITOR DISPLAY -->
  <div id="tvContainer" class="max-w-7xl mx-auto rounded-xl overflow-hidden border-2 border-slate-700 shadow-2xl">
    <!-- Top TV Header Banner -->
    <div id="tvHeader" class="px-6 py-4 flex flex-wrap items-center justify-between gap-4 border-b">
      <div class="flex items-center gap-3">
        <div id="tvSessionBadge" class="px-3 py-1 rounded font-black text-xs tracking-wider uppercase"></div>
        <div>
          <div id="tvTitle" class="font-extrabold text-xl tracking-wide"></div>
          <div id="tvSubtitle" class="text-xs opacity-80"></div>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <div id="tvCurrentBarBox" class="px-4 py-2 rounded-lg border text-right">
          <div class="text-xs font-bold uppercase tracking-wider opacity-75">NEXT ON PLATFORM</div>
          <div id="tvNextLifter" class="text-base font-extrabold"></div>
        </div>
        <div id="tvClockBox" class="px-4 py-2 rounded-lg border text-center min-w-[100px]">
          <div class="text-xs font-bold uppercase tracking-wider opacity-75">CLOCK</div>
          <div id="tvClock" class="text-xl font-black board-cell">1:00</div>
        </div>
      </div>
    </div>

    <!-- Main Scoreboard Table -->
    <div class="overflow-x-auto">
      <table class="w-full border-collapse text-base" id="scoreboardTable">
        <thead>
          <tr id="tableGroupHeader"></tr>
          <tr id="tableColHeader"></tr>
        </thead>
        <tbody id="scoreboardBody"></tbody>
      </table>
    </div>

    <!-- Bottom TV Status Strip -->

      <span id="tvFooterLeft"></span>
      <span id="tvFooterRight" class="font-semibold"></span>

    let activeScenarioId = 1;
    let showGuide = true;

    function renderScenarioButtons() {
      const container = document.getElementById("scenarioButtons");
      container.innerHTML = scenarios.map(s => {
        const active = s.id === activeScenarioId;
        const cls = active
          ? "px-3 py-2 rounded-lg text-xs font-bold text-left bg-sky-600 text-white border border-sky-400 shadow"
          : "px-3 py-2 rounded-lg text-xs font-semibold text-left bg-slate-950 text-slate-300 border border-slate-700 hover:bg-slate-800";
        return `<button onclick="selectScenario(${s.id})" class="${cls}">${s.shortTitle}</button>`;
      }).join("");
    }

    function toggleGuide() {
      showGuide = !showGuide;
      document.getElementById("expectedGuide").classList.toggle("hidden", !showGuide);
      document.getElementById("toggleGuideBtn").textContent = showGuide ? "📋 Hide Expected Results" : "📋 Show Expected Results";
    }

    function enterCleanTvMode(clean) {
      document.getElementById("controlsPanel").classList.toggle("hidden", clean);
      document.getElementById("restoreControlsBar").classList.toggle("hidden", !clean);
    }

    function formatAttemptCell(cell, theme) {
      if (!cell || cell.st === "E" || !cell.w) {
        const emptyClasses = theme === "club-light"
          ? "border-slate-300 bg-slate-50 text-slate-400"
          : "border-slate-700/80 bg-slate-900/60 text-slate-600";
        return `<td class="px-4 py-3.5 text-center board-cell border ${emptyClasses}">—</td>`;
      }

      const w = cell.w;
      const nextRing = cell.next ? "ring-2 ring-amber-400 ring-inset" : "";

      if (cell.st === "G") {
        if (theme === "plain-good-dark") {
          return `<td class="px-4 py-3.5 text-center font-extrabold text-lg board-cell border border-slate-700 bg-slate-800/90 text-white">${w}</td>`;
        }
        if (theme === "club-light") {
          return `<td class="px-4 py-3.5 text-center font-extrabold text-lg board-cell border border-emerald-600 bg-emerald-100 text-emerald-950">${w} ✓</td>`;
        }
        return `<td class="px-4 py-3.5 text-center font-extrabold text-lg board-cell border border-emerald-500/70 bg-emerald-900/85 text-emerald-100">${w}</td>`;
      }

      if (cell.st === "M") {
        if (theme === "club-light") {
          return `<td class="px-4 py-3.5 text-center font-extrabold text-lg board-cell border border-red-600 bg-red-100 text-red-900 strike-miss">-${w}-</td>`;
        }
        return `<td class="px-4 py-3.5 text-center font-extrabold text-lg board-cell border border-red-500/80 bg-red-950/90 text-red-200 strike-miss">${w}</td>`;
      }

      if (theme === "club-light") {
        const bg = cell.next ? "bg-amber-100 text-slate-950 font-black" : "bg-white text-slate-900 font-bold";
        return `<td class="px-4 py-3.5 text-center text-lg board-cell border border-slate-300 ${bg} ${nextRing}">${w}</td>`;
      }

      const pendingBg = cell.next
        ? "bg-amber-500/20 text-amber-200 font-black"
        : "bg-slate-800/40 text-slate-200 font-semibold";
      return `<td class="px-4 py-3.5 text-center text-lg board-cell border border-slate-700 ${pendingBg} ${nextRing}">${w}</td>`;
    }

    function selectScenario(id) {
      activeScenarioId = id;
      renderScenarioButtons();
      const s = scenarios.find(x => x.id === id);
      if (!s) return;

      document.getElementById("expectedGuide").innerHTML = s.guideHtml;

      const tvContainer = document.getElementById("tvContainer");
      const tvHeader = document.getElementById("tvHeader");
      const tvFooter = document.getElementById("tvFooter");
      const badge = document.getElementById("tvSessionBadge");
      const barBox = document.getElementById("tvCurrentBarBox");
      const clockBox = document.getElementById("tvClockBox");

      if (s.theme === "club-light") {
        tvContainer.className = "max-w-7xl mx-auto rounded-xl overflow-hidden border-2 border-slate-400 shadow-xl bg-white text-slate-900";
        tvHeader.className = "px-6 py-4 flex flex-wrap items-center justify-between gap-4 border-b border-slate-300 bg-slate-100 text-slate-900";
        badge.className = "px-3 py-1 rounded font-black text-xs tracking-wider uppercase bg-sky-700 text-white";
        barBox.className = "px-4 py-2 rounded-lg border border-amber-500 bg-amber-50 text-slate-900 text-right";
        clockBox.className = "px-4 py-2 rounded-lg border border-slate-400 bg-white text-slate-900 text-center min-w-[100px]";
        tvFooter.className = "px-6 py-2.5 text-xs flex flex-wrap items-center justify-between border-t border-slate-300 bg-slate-100 text-slate-700";
      } else if (s.theme === "iwf-blue") {
        tvContainer.className = "max-w-7xl mx-auto rounded-xl overflow-hidden border-2 border-blue-500/60 shadow-2xl bg-[#07132B] text-white";
        tvHeader.className = "px-6 py-4 flex flex-wrap items-center justify-between gap-4 border-b border-blue-800 bg-[#0C214A] text-white";
        badge.className = "px-3 py-1 rounded font-black text-xs tracking-wider uppercase bg-amber-400 text-slate-950";
        barBox.className = "px-4 py-2 rounded-lg border border-amber-400/70 bg-amber-500/10 text-amber-200 text-right";
        clockBox.className = "px-4 py-2 rounded-lg border border-blue-500 bg-[#07132B] text-amber-300 text-center min-w-[100px]";
        tvFooter.className = "px-6 py-2.5 text-xs flex flex-wrap items-center justify-between border-t border-blue-900 bg-[#0A1938] text-blue-200";
      } else {
        tvContainer.className = "max-w-7xl mx-auto rounded-xl overflow-hidden border-2 border-slate-700 shadow-2xl bg-[#090E17] text-slate-100";
        tvHeader.className = "px-6 py-4 flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 bg-[#111827] text-slate-100";
        badge.className = "px-3 py-1 rounded font-black text-xs tracking-wider uppercase bg-sky-600 text-white";
        barBox.className = "px-4 py-2 rounded-lg border border-amber-500/60 bg-amber-500/10 text-amber-300 text-right";
        clockBox.className = "px-4 py-2 rounded-lg border border-slate-700 bg-slate-900 text-emerald-400 text-center min-w-[100px]";
        tvFooter.className = "px-6 py-2.5 text-xs flex flex-wrap items-center justify-between border-t border-slate-800 bg-[#111827] text-slate-400";
      }

      badge.textContent = s.sessionBadge;
      document.getElementById("tvTitle").textContent = s.title;
      document.getElementById("tvSubtitle").textContent = s.subtitle;
      document.getElementById("tvNextLifter").textContent = s.nextLifter;
      document.getElementById("tvClock").textContent = s.clock;
      document.getElementById("tvFooterLeft").textContent = s.footerLeft;
      document.getElementById("tvFooterRight").textContent = s.footerRight;

      const isLight = s.theme === "club-light";
      const thBase = isLight
        ? "border border-slate-300 bg-slate-200 text-slate-800"
        : "border border-slate-700 bg-slate-900 text-slate-300";
      const snHeader = isLight
        ? "border border-slate-300 bg-sky-100 text-sky-900"
        : "border border-slate-700 bg-sky-950/80 text-sky-300";
      const cjHeader = isLight
        ? "border border-slate-300 bg-purple-100 text-purple-900"
        : "border border-slate-700 bg-purple-950/80 text-purple-300";

      document.getElementById("tableGroupHeader").innerHTML = `
        <th colspan="3" class="px-3 py-2 text-left text-xs font-extrabold uppercase tracking-wider ${thBase}">ATHLETE INFORMATION</th>
        <th colspan="4" class="px-3 py-2 text-center text-xs font-extrabold uppercase tracking-wider ${snHeader}">SNATCH (KG)</th>
        <th colspan="4" class="px-3 py-2 text-center text-xs font-extrabold uppercase tracking-wider ${cjHeader}">CLEAN &amp; JERK (KG)</th>
        <th class="px-3 py-2 text-center text-xs font-extrabold uppercase tracking-wider ${thBase}">TOTAL</th>
      `;

      document.getElementById("tableColHeader").innerHTML = `
        <th class="px-3 py-2 text-center text-xs font-bold ${thBase}">LOT</th>
        <th class="px-4 py-2 text-left text-xs font-bold ${thBase}">NAME</th>
        <th class="px-3 py-2 text-center text-xs font-bold ${thBase}">CAT</th>
        <th class="px-4 py-2 text-center text-xs font-bold ${snHeader}">1</th>
        <th class="px-4 py-2 text-center text-xs font-bold ${snHeader}">2</th>
        <th class="px-4 py-2 text-center text-xs font-bold ${snHeader}">3</th>
        <th class="px-4 py-2 text-center text-xs font-bold ${snHeader}">BEST</th>
        <th class="px-4 py-2 text-center text-xs font-bold ${cjHeader}">1</th>
        <th class="px-4 py-2 text-center text-xs font-bold ${cjHeader}">2</th>
        <th class="px-4 py-2 text-center text-xs font-bold ${cjHeader}">3</th>
        <th class="px-4 py-2 text-center text-xs font-bold ${cjHeader}">BEST</th>
        <th class="px-4 py-2 text-center text-xs font-bold ${thBase}">TOT</th>
      `;

      const tbody = document.getElementById("scoreboardBody");
      tbody.innerHTML = s.lifters.map((r, idx) => {
        const rowBg = isLight
          ? (idx % 2 === 0 ? "bg-white" : "bg-slate-50/80")
          : (idx % 2 === 0 ? "bg-[#0D1526]" : "bg-[#111C33]");
        const cellBorder = isLight ? "border-slate-300" : "border-slate-700/80";
        const textPrimary = isLight ? "text-slate-900" : "text-white";
        const textSecondary = isLight ? "text-slate-600" : "text-slate-400";

        return `
          <tr class="${rowBg}">
            <td class="px-3 py-3.5 text-center font-bold board-cell border ${cellBorder} ${textSecondary}">${r.lot}</td>
            <td class="px-4 py-3.5 font-extrabold tracking-wide border ${cellBorder} ${textPrimary}">${r.name}</td>
            <td class="px-3 py-3.5 text-center text-xs font-bold border ${cellBorder} ${textSecondary}">${r.cat}</td>
            ${formatAttemptCell(r.s1, s.theme)}
            ${formatAttemptCell(r.s2, s.theme)}
            ${formatAttemptCell(r.s3, s.theme)}
            <td class="px-4 py-3.5 text-center font-black board-cell border ${cellBorder} ${isLight ? "bg-sky-50 text-sky-900" : "bg-slate-900/90 text-sky-300"}">${r.bestS ?? "—"}</td>
            ${formatAttemptCell(r.cj1, s.theme)}
            ${formatAttemptCell(r.cj2, s.theme)}
            ${formatAttemptCell(r.cj3, s.theme)}
            <td class="px-4 py-3.5 text-center font-black board-cell border ${cellBorder} ${isLight ? "bg-purple-50 text-purple-900" : "bg-slate-900/90 text-purple-300"}">${r.bestCj ?? "—"}</td>
            <td class="px-4 py-3.5 text-center font-black board-cell border ${cellBorder} ${textPrimary}">${r.total ?? "—"}</td>
          </tr>
        `;
      }).join("");
    }

    selectScenario(1);
  </script>
